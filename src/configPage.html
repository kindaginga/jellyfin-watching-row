<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Watching Row</title>
</head>
<body>
    <div id="WatchingRowConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="WatchingRowConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="KeepNextUpRow" type="checkbox" is="emby-checkbox" />
                            <span>Keep the separate Next Up row on the home screen</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">Continue Watching already shows each series' next episode, so the Next Up row is hidden unless this is checked.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var WatchingRowConfig = { pluginUniqueId: '5b1f0c3e-7d2a-4c86-9a41-2e6f8d0b9c17' };

            document.querySelector('#WatchingRowConfigPage').addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(WatchingRowConfig.pluginUniqueId).then(function (config) {
                    document.querySelector('#KeepNextUpRow').checked = config.KeepNextUpRow;
                    Dashboard.hideLoadingMsg();
                });
            });

            document.querySelector('#WatchingRowConfigForm').addEventListener('submit', function (e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(WatchingRowConfig.pluginUniqueId).then(function (config) {
                    config.KeepNextUpRow = document.querySelector('#KeepNextUpRow').checked;
                    ApiClient.updatePluginConfiguration(WatchingRowConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
